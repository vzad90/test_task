services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loan_review
      POSTGRES_PASSWORD: loan
      POSTGRES_USER: loan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loan_review"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        corepack enable
        pnpm install --frozen-lockfile
        pnpm db:generate
        pnpm db:migrate
        pnpm db:seed
        exec pnpm exec turbo run dev
    environment:
      DATABASE_URL: postgresql://loan:loan@postgres:5432/loan_review?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/trpc
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "4000:4000"
    volumes:
      - .:/workspace
      - app-root-modules:/workspace/node_modules
      - app-web-modules:/workspace/apps/web/node_modules
      - app-api-modules:/workspace/apps/api/node_modules
      - app-db-modules:/workspace/packages/db/node_modules
      - app-config-modules:/workspace/packages/config/node_modules

  workspace:
    profiles: ["devcontainer"]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: /bin/sh -c "while sleep 1000; do :; done"
    environment:
      DATABASE_URL: postgresql://loan:loan@postgres:5432/loan_review?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/trpc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/workspace:cached

volumes:
  postgres-data:
  redis-data:
  app-root-modules:
  app-web-modules:
  app-api-modules:
  app-db-modules:
  app-config-modules:
